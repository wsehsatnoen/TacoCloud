<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
        xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Taco Cloud</title>
    <link rel="stylesheet" th:ref="@{/styles.css}">
</head>
<body>

    <form method="POST" th:action="@{/orders}" th:object="${tacoOrder}">
        <h1>Order your taco creations!</h1>

        <h3>Your tacos in this order: </h3>
        <a th:href="@{/design}" id="another">Design another taco</a>
        <ul>
            <li th:each="taco : ${tacoOrder.tacos}">
                <span th:text="${taco.name}">Taco Name</span>
            </li>
        </ul>

        <h3>Deliver my taco masterpieces to...</h3>
        <label for="deliveryName">Name: </label>
        <input type="text" th:field="*{deliveryName}"/>
        <span class="validation-error" th:if="${#fields.hasErrors('deliveryName')}">deliveryName Error</span>
        <br/>
        <label for="deliveryStreet">Street Address: </label>
        <input type="text" th:field="*{deliveryStreet}"/>
        <span class="validation-error" th:if="${#fields.hasErrors('deliveryStreet')}">deliveryStreet Error</span>
        <br/>
        <label for="deliveryCity">City: </label>
        <input type="text" th:field="*{deliveryCity}"/>
        <span class="validation-error" th:if="${#fields.hasErrors('deliveryCity')}">deliveryCity Error</span>
        <br/>
        <label for="deliveryState">State: </label>
        <input type="text" th:field="*{deliveryState}"/>
        <span class="validation-error" th:if="${#fields.hasErrors('deliveryState')}">deliveryState Error</span>
        <br/>
        <label for="deliveryZip">Zip Code: </label>
        <input type="text" th:field="*{deliveryZip}"/>
        <span class="validation-error" th:if="${#fields.hasErrors('deliveryZip')}">deliveryZip Error</span>
        <br/>

        <h3>Here's how I'll pay...</h3>
        <label for="ccNumber">Credit Card #:</label>
        <input type="text" th:field="*{ccNumber}"/>
        <span class="validation-error" th:if="${#fields.hasErrors('ccNumber')}">CC Num Error</span>
        <br/>
        <label for="ccExpiration">Expiration Date:</label>
        <input type="text" th:field="*{ccExpiration}"/>
        <span class="validation-error" th:if="${#fields.hasErrors('ccExpiration')}">CC Exp Error</span>
        <br/>
        <label for="ccCVV">CVV:</label>
        <input type="text" th:field="*{ccCVV}"/>
        <span class="validation-error" th:if="${#fields.hasErrors('ccCVV')}">CC CCV Error</span>
        <br/>
        <input type="submit" value="Submit Order"/>
    </form>
</body>
</html>
